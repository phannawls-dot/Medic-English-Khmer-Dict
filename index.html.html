const q=document.getElementById('q'),list=document.getElementById('list'),meta=document.getElementById('meta'),more=document.getElementById('more'),az=document.getElementById('az');
let letter='',shown=0,res=[];const PAGE=60;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hl(s,t){s=esc(s);if(!t)return s;const i=s.toLowerCase().indexOf(esc(t).toLowerCase());return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+esc(t).length)+'</mark>'+s.slice(i+esc(t).length)}
function run(){
  const t=q.value.trim(),tl=t.toLowerCase();
  res=D.filter(([en,km])=>{
    if(letter&&!en.toLowerCase().startsWith(letter))return false;
    if(!t)return true;
    return en.toLowerCase().includes(tl)||km.some(k=>k.includes(t));
  });
  if(t)res.sort((a,b)=>(b[0].toLowerCase().startsWith(tl))-(a[0].toLowerCase().startsWith(tl)));
  shown=0;list.innerHTML='';draw();
}
function draw(){
  const t=q.value.trim(),end=Math.min(res.length,shown+PAGE);
  list.insertAdjacentHTML('beforeend',res.slice(shown,end).map(([en,km])=>`<article class="e"><div class="en">${hl(en,t)}</div><div class="km">${km.map(k=>`<span>${hl(k,t)}</span>`).join('')}</div></article>`).join(''));
  shown=end;more.hidden=shown>=res.length;
  meta.textContent=res.length?`${res.length} of ${D.length} entries`:'';
  if(!res.length)list.innerHTML='<div class="empty">No entries match. Try a shorter word or another letter.</div>';
}
'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(c=>{const b=document.createElement('button');b.textContent=c;b.setAttribute('aria-pressed','false');
 b.onclick=()=>{letter=letter===c.toLowerCase()?'':c.toLowerCase();[...az.children].forEach(x=>x.setAttribute('aria-pressed',x.textContent.toLowerCase()===letter));run();scrollTo(0,0)};az.appendChild(b)});
q.addEventListener('input',run);more.onclick=draw;
document.getElementById('th').onclick=()=>{const r=document.documentElement,d=matchMedia('(prefers-color-scheme:dark)').matches;const cur=r.dataset.theme||(d?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark'};
run();
